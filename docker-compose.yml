services:
  db:
    image: postgres:16.4
    container_name: proyecto-secop-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  jupyter:
    image: quay.io/jupyter/scipy-notebook:2026-07-28
    container_name: proyecto-secop-jupyter
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./src:/home/jovyan/work/src
      - ./data:/home/jovyan/work/data
      - ./docs:/home/jovyan/work/docs
      - ./requirements.txt:/home/jovyan/work/requirements.txt
    working_dir: /home/jovyan/work
    command: >
      bash -c "pip install --quiet -r requirements.txt &&
               start-notebook.py --NotebookApp.token=''"

volumes:
  pgdata:
