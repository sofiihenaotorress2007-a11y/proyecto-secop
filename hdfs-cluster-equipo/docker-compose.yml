services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-namenode
    restart: unless-stopped
    environment:
      - CLUSTER_NAME=practica-secop
    env_file:
      - hadoop.env
    ports:
      - "9870:9870"   # interfaz web del namenode (para ver bloques y replicas)
      - "9000:9000"   # puerto RPC que usan los clientes HDFS
    volumes:
      - namenode-data:/hadoop/dfs/name

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-datanode1
    restart: unless-stopped
    depends_on:
      - namenode
    env_file:
      - hadoop.env
    volumes:
      - datanode1-data:/hadoop/dfs/data

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-datanode2
    restart: unless-stopped
    depends_on:
      - namenode
    env_file:
      - hadoop.env
    volumes:
      - datanode2-data:/hadoop/dfs/data

  datanode3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-datanode3
    restart: unless-stopped
    depends_on:
      - namenode
    env_file:
      - hadoop.env
    volumes:
      - datanode3-data:/hadoop/dfs/data

volumes:
  namenode-data:
  datanode1-data:
  datanode2-data:
  datanode3-data:
